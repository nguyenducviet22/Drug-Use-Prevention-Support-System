name: Continuous Integration

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  backend-ci:
    name: Java Spring Boot CI (Build, Quality, Tests & Coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x Back-end/mvnw

      - name: Checkstyle Static Analysis
        working-directory: Back-end
        run: ./mvnw checkstyle:check

      - name: SpotBugs Bug Detection
        working-directory: Back-end
        run: ./mvnw spotbugs:check

      - name: Automated Tests & JaCoCo Coverage Threshold
        working-directory: Back-end
        run: ./mvnw test jacoco:report jacoco:check

      - name: Full Verify Lifecycle Gating
        working-directory: Back-end
        run: ./mvnw clean verify
