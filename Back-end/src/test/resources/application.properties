spring.application.name=drug-use-prevention-support-system-test

# DataSource Configuration for In-Memory H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway disabled for unit/context tests
spring.flyway.enabled=false

# JWT configuration for tests
jwt.secret=fpt-university-swp391-su25-drug-use-prevention-support-system
jwt.issuer=swp.com
jwt.valid-duration=6000000
jwt.refreshable-duration=1209600000

# Mail configuration
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=testpassword

# OAuth2 Client for tests
spring.security.oauth2.client.registration.google.client-id=mock-client-id
spring.security.oauth2.client.registration.google.client-secret=mock-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# Google API Config
google.api.tokens-directory-path=target/tokens
google.api.credentials-file-path=/credentials.json
google.api.redirect-port=8889

# Cloudinary mock properties for tests
cloudinary.cloud_name=dummy-cloud
cloudinary.api_key=123456789
cloudinary.api_secret=dummy-secret

